<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #B05C81; text-decoration: none; }
    a:hover { color: #8E4767; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #FBF2F5; font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; color: #32222B; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; top: -160px; left: -110px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, rgba(186,148,214,0.22) 0%, rgba(186,148,214,0) 70%); pointer-events: none;"></div>

  <div style="position: relative; padding: 58px 22px 14px;">
    <div style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em;">الإعدادات</div>
  </div>

  <div style="position: relative; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 6px 18px;">

    <div style="padding: 4px 4px 0; font-size: 11.5px; font-weight: 300; color: #AE97A2;">نورا</div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 4px 0; box-shadow: 0 3px 16px rgba(50,34,43,0.05); display: flex; flex-direction: column;">

      <div style="display: flex; align-items: center; gap: 14px; padding: 15px 20px;">
        <span style="font-size: 14.5px; font-weight: 300; flex-grow: 1;">اسمها</span>
        <span style="font-size: 14.5px; font-weight: 300; color: #8A7581;">نورا</span>
      </div>
      <div style="height: 1px; background: #F6EDF1; margin: 0 20px;"></div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 15px 20px;">
        <span style="font-size: 14.5px; font-weight: 300; flex-grow: 1;">النوع</span>
        <span style="font-size: 14.5px; font-weight: 300; color: #8A7581;">بنت</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#D8C4CD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </div>
      <div style="height: 1px; background: #F6EDF1; margin: 0 20px;"></div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 15px 20px;">
        <span style="font-size: 14.5px; font-weight: 300; flex-grow: 1;">لغتها</span>
        <span style="font-size: 14.5px; font-weight: 300; color: #8A7581;">مصري</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#D8C4CD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </div>
      <div style="height: 1px; background: #F6EDF1; margin: 0 20px;"></div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 15px 20px;">
        <span style="font-size: 14.5px; font-weight: 300; flex-grow: 1;">صوتها</span>
        <span style="font-size: 14.5px; font-weight: 300; color: #8A7581;">Aoede</span>
        <button style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: rgba(226,152,183,0.16); border: none; display: flex; align-items: center; justify-content: center; color: #C2708F; cursor: pointer; padding: 0;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>

    </div>

    <!-- role -->
    <div style="background: #FFFFFF; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 13px; box-shadow: 0 3px 16px rgba(50,34,43,0.05);">
      <span style="font-size: 14.5px; font-weight: 300;">هي إيه بالنسبالك</span>
      <div style="display: flex; gap: 7px;">
        <span style="flex-grow: 1; text-align: center; font-size: 12px; font-weight: 400; color: #FFFFFF; background: linear-gradient(150deg, #E298B7, #C77FB8); border-radius: 13px; padding: 11px 6px;">بتكبر معاك</span>
        <span style="flex-grow: 1; text-align: center; font-size: 12px; font-weight: 300; color: #7A6470; background: #FAF3F6; border-radius: 13px; padding: 11px 6px;">سكرتيرة</span>
        <span style="flex-grow: 1; text-align: center; font-size: 12px; font-weight: 300; color: #7A6470; background: #FAF3F6; border-radius: 13px; padding: 11px 6px;">رفيقة</span>
      </div>
      <span style="font-size: 11.5px; font-weight: 300; color: #AE97A2; line-height: 1.75;">بتبدأ سكرتيرة، والعلاقة بتكبر حسب تعاملك معاها.</span>
    </div>

    <!-- dials -->
    <div style="background: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 19px; box-shadow: 0 3px 16px rgba(50,34,43,0.05);">
      <span style="font-size: 14.5px; font-weight: 300;">طباعها</span>

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 300;">
          <span style="color: #7A6470;">هزار ودلع</span><span style="color: #AE97A2; font-variant-numeric: tabular-nums;">٨٠٪</span>
        </div>
        <div style="position: relative; height: 5px; border-radius: 3px; background: #F4E7ED;">
          <div style="width: 80%; height: 100%; background: linear-gradient(90deg, #BA94D6, #E298B7); border-radius: 3px;"></div>
          <span style="position: absolute; top: 50%; right: 80%; transform: translate(50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 8px rgba(200,120,160,0.35);"></span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 300;">
          <span style="color: #7A6470;">صراحة</span><span style="color: #AE97A2; font-variant-numeric: tabular-nums;">٦٥٪</span>
        </div>
        <div style="position: relative; height: 5px; border-radius: 3px; background: #F4E7ED;">
          <div style="width: 65%; height: 100%; background: linear-gradient(90deg, #BA94D6, #E298B7); border-radius: 3px;"></div>
          <span style="position: absolute; top: 50%; right: 65%; transform: translate(50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 8px rgba(200,120,160,0.35);"></span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 300;">
          <span style="color: #7A6470;">حنية</span><span style="color: #AE97A2; font-variant-numeric: tabular-nums;">٨٥٪</span>
        </div>
        <div style="position: relative; height: 5px; border-radius: 3px; background: #F4E7ED;">
          <div style="width: 85%; height: 100%; background: linear-gradient(90deg, #BA94D6, #E298B7); border-radius: 3px;"></div>
          <span style="position: absolute; top: 50%; right: 85%; transform: translate(50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 8px rgba(200,120,160,0.35);"></span>
        </div>
      </div>
    </div>

    <div style="padding: 6px 4px 0; font-size: 11.5px; font-weight: 300; color: #AE97A2;">التطبيق</div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 4px 0; box-shadow: 0 3px 16px rgba(50,34,43,0.05); display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px 20px;">
        <span style="font-size: 14.5px; font-weight: 300; flex-grow: 1;">المظهر</span>
        <div style="display: flex; gap: 3px; background: #FAF3F6; border-radius: 11px; padding: 3px;">
          <span style="font-size: 11.5px; font-weight: 400; color: #FFFFFF; background: #D97DA5; padding: 6px 12px; border-radius: 8px;">فاتح</span>
          <span style="font-size: 11.5px; font-weight: 300; color: #A08D97; padding: 6px 12px; border-radius: 8px;">غامق</span>
          <span style="font-size: 11.5px; font-weight: 300; color: #A08D97; padding: 6px 12px; border-radius: 8px;">تلقائي</span>
        </div>
      </div>
      <div style="height: 1px; background: #F6EDF1; margin: 0 20px;"></div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 15px 20px;">
        <span style="font-size: 14.5px; font-weight: 300; flex-grow: 1;">الإشعارات</span>
        <span style="width: 46px; height: 27px; border-radius: 999px; background: linear-gradient(150deg, #E298B7, #C77FB8); position: relative; flex-shrink: 0;">
          <span style="position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #FFFFFF;"></span>
        </span>
      </div>
      <div style="height: 1px; background: #F6EDF1; margin: 0 20px;"></div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 15px 20px;">
        <span style="font-size: 14.5px; font-weight: 300; color: #8A7581; flex-grow: 1;">إعدادات متقدّمة</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#D8C4CD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
