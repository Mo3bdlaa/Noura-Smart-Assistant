<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #D9A05B; text-decoration: none; }
    a:hover { color: #E8B87A; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #141210; font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; color: #F4EFE7; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 56px 20px 18px; border-bottom: 1px solid #262119;">
    <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em;">الإعدادات</div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column;">

    <div style="padding: 22px 20px 8px; font-size: 11.5px; color: #6F6656; letter-spacing: 0.05em;">مساعدك</div>

    <!-- name -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid #201C17;">
      <span style="font-size: 14.5px; color: #E4DCD0; flex-grow: 1;">الاسم</span>
      <span style="font-size: 14.5px; color: #8C8273;">نورا</span>
    </div>

    <!-- role -->
    <div style="display: flex; flex-direction: column; gap: 11px; padding: 16px 20px; border-bottom: 1px solid #201C17;">
      <span style="font-size: 14.5px; color: #E4DCD0;">نوعها</span>
      <div style="display: flex; gap: 7px;">
        <span style="flex-grow: 1; text-align: center; font-size: 12px; font-weight: 500; color: #1B1510; background: #D9A05B; border-radius: 9px; padding: 9px 6px;">بتكبر معاك</span>
        <span style="flex-grow: 1; text-align: center; font-size: 12px; color: #A69C8D; border: 1px solid #2E2921; border-radius: 9px; padding: 9px 6px;">سكرتيرة</span>
        <span style="flex-grow: 1; text-align: center; font-size: 12px; color: #A69C8D; border: 1px solid #2E2921; border-radius: 9px; padding: 9px 6px;">رفيقة</span>
      </div>
      <span style="font-size: 11.5px; color: #6F6656; line-height: 1.6;">بتبدأ سكرتيرة، والعلاقة بتكبر حسب تعاملك.</span>
    </div>

    <!-- gender + language -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid #201C17;">
      <span style="font-size: 14.5px; color: #E4DCD0; flex-grow: 1;">النوع</span>
      <span style="font-size: 14.5px; color: #8C8273;">بنت</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4A4238" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid #201C17;">
      <span style="font-size: 14.5px; color: #E4DCD0; flex-grow: 1;">لغتها</span>
      <span style="font-size: 14.5px; color: #8C8273;">مصري</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4A4238" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>

    <!-- voice with preview -->
    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-bottom: 1px solid #201C17;">
      <span style="font-size: 14.5px; color: #E4DCD0; flex-grow: 1;">صوتها</span>
      <span style="font-size: 14.5px; color: #8C8273;">Aoede</span>
      <button style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: #221E19; border: 1px solid #302A22; display: flex; align-items: center; justify-content: center; color: #D9A05B; cursor: pointer; padding: 0;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <!-- personality dials -->
    <div style="display: flex; flex-direction: column; gap: 17px; padding: 18px 20px; border-bottom: 1px solid #201C17;">
      <span style="font-size: 14.5px; color: #E4DCD0;">شخصيتها</span>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px;">
          <span style="color: #A69C8D;">الهزار</span><span style="color: #6F6656; font-variant-numeric: tabular-nums;">٨٠٪</span>
        </div>
        <div style="position: relative; height: 3px; border-radius: 2px; background: #2E2921;">
          <div style="width: 80%; height: 100%; background: #D9A05B; border-radius: 2px;"></div>
          <span style="position: absolute; top: 50%; right: 80%; transform: translate(50%, -50%); width: 16px; height: 16px; border-radius: 50%; background: #F4EFE7; border: 3px solid #141210;"></span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px;">
          <span style="color: #A69C8D;">الصراحة</span><span style="color: #6F6656; font-variant-numeric: tabular-nums;">٦٥٪</span>
        </div>
        <div style="position: relative; height: 3px; border-radius: 2px; background: #2E2921;">
          <div style="width: 65%; height: 100%; background: #D9A05B; border-radius: 2px;"></div>
          <span style="position: absolute; top: 50%; right: 65%; transform: translate(50%, -50%); width: 16px; height: 16px; border-radius: 50%; background: #F4EFE7; border: 3px solid #141210;"></span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px;">
          <span style="color: #A69C8D;">الحنية</span><span style="color: #6F6656; font-variant-numeric: tabular-nums;">٨٠٪</span>
        </div>
        <div style="position: relative; height: 3px; border-radius: 2px; background: #2E2921;">
          <div style="width: 80%; height: 100%; background: #D9A05B; border-radius: 2px;"></div>
          <span style="position: absolute; top: 50%; right: 80%; transform: translate(50%, -50%); width: 16px; height: 16px; border-radius: 50%; background: #F4EFE7; border: 3px solid #141210;"></span>
        </div>
      </div>
    </div>

    <!-- app -->
    <div style="padding: 22px 20px 8px; font-size: 11.5px; color: #6F6656; letter-spacing: 0.05em;">التطبيق</div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid #201C17;">
      <span style="font-size: 14.5px; color: #E4DCD0; flex-grow: 1;">المظهر</span>
      <div style="display: flex; gap: 4px; background: #1E1B16; border: 1px solid #2E2921; border-radius: 9px; padding: 3px;">
        <span style="font-size: 11.5px; color: #6F6656; padding: 5px 11px; border-radius: 6px;">فاتح</span>
        <span style="font-size: 11.5px; color: #1B1510; background: #D9A05B; padding: 5px 11px; border-radius: 6px; font-weight: 500;">غامق</span>
        <span style="font-size: 11.5px; color: #6F6656; padding: 5px 11px; border-radius: 6px;">تلقائي</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid #201C17;">
      <span style="font-size: 14.5px; color: #E4DCD0; flex-grow: 1;">الإشعارات</span>
      <span style="width: 42px; height: 25px; border-radius: 999px; background: #D9A05B; position: relative; flex-shrink: 0;">
        <span style="position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #1B1510;"></span>
      </span>
    </div>

    <!-- advanced, collapsed -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 15px 20px; border-bottom: 1px solid #201C17;">
      <span style="font-size: 14.5px; color: #8C8273; flex-grow: 1;">إعدادات متقدّمة</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4A4238" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
