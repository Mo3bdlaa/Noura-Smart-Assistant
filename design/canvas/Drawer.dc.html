<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #B05C81; text-decoration: none; }
    a:hover { color: #8E4767; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #E8DDE3; font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; color: #32222B; display: flex; overflow: hidden;">

  <div style="width: 310px; height: 100%; background: #FBF2F5; display: flex; flex-direction: column; position: relative; overflow: hidden;">

    <div style="position: absolute; top: -140px; right: -100px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, rgba(226,152,183,0.30) 0%, rgba(226,152,183,0) 70%); pointer-events: none;"></div>

    <!-- identity -->
    <div style="position: relative; padding: 58px 22px 22px; display: flex; align-items: center; gap: 14px;">
      <div style="position: relative; width: 52px; height: 52px; flex-shrink: 0;">
        <div style="position: absolute; inset: -8px; border-radius: 50%; background: radial-gradient(circle, rgba(200,92,131,0.20) 0%, rgba(200,92,131,0) 72%);"></div>
        <div style="position: relative; width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(155deg, #E298B7, #BA94D6); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500; color: #FFFFFF;">ن</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <div style="font-size: 18px; font-weight: 500;">نورا</div>
        <div style="font-size: 12.5px; font-weight: 300; color: #B05C81;">مبسوطة إنك جيت</div>
      </div>
    </div>

    <!-- new -->
    <div style="position: relative; display: flex; gap: 9px; padding: 4px 18px 18px;">
      <button style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; background: #FFFFFF; border: none; border-radius: 15px; font-family: inherit; font-size: 13.5px; font-weight: 300; color: #32222B; cursor: pointer; box-shadow: 0 2px 12px rgba(50,34,43,0.05);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D97DA5" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        محادثة جديدة
      </button>
      <button style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: none; border-radius: 15px; color: #7A6470; cursor: pointer; padding: 0; box-shadow: 0 2px 12px rgba(50,34,43,0.05);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="14" r="4"/><circle cx="17" cy="14" r="4"/><path d="M11 14h2M3 10l3-3h12l3 3" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- conversations -->
    <div style="position: relative; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 3px; padding: 0 12px;">
      <div style="padding: 6px 10px 8px; font-size: 11px; font-weight: 300; color: #AE97A2;">المحادثات</div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 15px; background: rgba(217,125,165,0.13); cursor: pointer;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #D97DA5; flex-shrink: 0;"></span>
        <span style="font-size: 14.5px; font-weight: 400; flex-grow: 1;">الأساسية</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 15px; cursor: pointer;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #E0CDD6; flex-shrink: 0;"></span>
        <span style="font-size: 14.5px; font-weight: 300; color: #61505A; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">مشروع الشغل الجديد</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 15px; cursor: pointer;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #E0CDD6; flex-shrink: 0;"></span>
        <span style="font-size: 14.5px; font-weight: 300; color: #61505A; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">تنظيم السفر</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 15px; cursor: pointer;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #D6C4E4; flex-shrink: 0;"></span>
        <span style="font-size: 14.5px; font-weight: 300; color: #61505A; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">مشهد المستشفى</span>
        <span style="font-size: 10px; font-weight: 300; color: #8B62B0; background: rgba(186,148,214,0.16); border-radius: 999px; padding: 3px 8px;">مؤقتة</span>
      </div>
    </div>

    <!-- footer -->
    <div style="position: relative; padding: 12px; display: flex; flex-direction: column; gap: 2px;">
      <div style="display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 14px; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D97DA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1l8.8 8.8 8.8-8.8a5 5 0 0 0 0-7.1z"/></svg>
        <span style="font-size: 14.5px; font-weight: 300;">الرحلة</span>
      </div>
      <div style="display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 14px; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#BA94D6" stroke-width="1.6" stroke-linecap="round"><path d="M12 4a4 4 0 0 0-4 4 3 3 0 0 0-1 5.8A3.5 3.5 0 0 0 10 20h4a3.5 3.5 0 0 0 3-6.2A3 3 0 0 0 16 8a4 4 0 0 0-4-4zM12 4v16"/></svg>
        <span style="font-size: 14.5px; font-weight: 300;">الذاكرة</span>
      </div>
      <div style="display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 14px; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#86B79E" stroke-width="1.6" stroke-linecap="round"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6M10.5 20a2 2 0 0 0 3 0"/></svg>
        <span style="font-size: 14.5px; font-weight: 300; flex-grow: 1;">المهام</span>
        <span style="font-size: 11px; font-weight: 400; color: #FFFFFF; background: #D97DA5; border-radius: 999px; min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; padding: 0 6px;">٣</span>
      </div>
      <div style="display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 14px; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A6470" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2M12 19.5v2M21.5 12h-2M4.5 12h-2M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4M18.7 18.7l-1.4-1.4M6.7 6.7L5.3 5.3" stroke-linecap="round"/></svg>
        <span style="font-size: 14.5px; font-weight: 300;">الإعدادات</span>
      </div>
      <div style="display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 14px; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B7A3AC" stroke-width="1.6" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span style="font-size: 14.5px; font-weight: 300; color: #A08D97;">خروج</span>
      </div>
    </div>

  </div>

  <div style="flex-grow: 1; height: 100%; background: rgba(50,34,43,0.28);"></div>

</div>
</x-dc>
</body>
</html>
