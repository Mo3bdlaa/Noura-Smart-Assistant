<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #D9A05B; text-decoration: none; }
    a:hover { color: #E8B87A; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #0D0B09; font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; color: #F4EFE7; display: flex; overflow: hidden; position: relative;">

  <!-- drawer panel -->
  <div style="width: 306px; height: 100%; background: #171410; border-left: 1px solid #262119; display: flex; flex-direction: column;">

    <!-- assistant identity -->
    <div style="padding: 56px 20px 18px; display: flex; align-items: center; gap: 13px; border-bottom: 1px solid #232019;">
      <div style="position: relative; width: 48px; height: 48px; flex-shrink: 0;">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(150deg, #3A322A, #241F18); border: 1px solid #38312A; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 600; color: #C9A87C;">ن</div>
        <div style="position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid #7FB396; opacity: 0.55;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <div style="font-size: 17px; font-weight: 600;">نورا</div>
        <div style="font-size: 12.5px; color: #7FB396;">موجودة معاك</div>
      </div>
    </div>

    <!-- new conversation -->
    <div style="display: flex; gap: 8px; padding: 16px 16px 14px;">
      <button style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 40px; background: #221E19; border: 1px solid #302A22; border-radius: 11px; font-family: inherit; font-size: 13px; color: #F4EFE7; cursor: pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        محادثة جانبية
      </button>
      <button style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #221E19; border: 1px solid #302A22; border-radius: 11px; color: #A69C8D; cursor: pointer; padding: 0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="14" r="4"/><circle cx="17" cy="14" r="4"/><path d="M11 14h2M3 10l3-3h12l3 3" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- conversations -->
    <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 2px; padding: 0 10px;">
      <div style="padding: 8px 10px 6px; font-size: 11px; color: #6F6656; letter-spacing: 0.04em;">المحادثات</div>

      <div style="display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 11px; background: #221E19; cursor: pointer;">
        <span style="width: 3px; height: 18px; border-radius: 2px; background: #D9A05B; flex-shrink: 0;"></span>
        <span style="font-size: 14.5px; font-weight: 500; flex-grow: 1;">الأساسية</span>
      </div>

      <div style="display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 11px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F6656" stroke-width="1.6" style="flex-shrink: 0;"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z" stroke-linejoin="round"/></svg>
        <span style="font-size: 14.5px; color: #C4BAAA; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">مشروع الشغل الجديد</span>
      </div>

      <div style="display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 11px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F6656" stroke-width="1.6" style="flex-shrink: 0;"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z" stroke-linejoin="round"/></svg>
        <span style="font-size: 14.5px; color: #C4BAAA; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">تنظيم السفر</span>
      </div>

      <div style="display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 11px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F6656" stroke-width="1.6" style="flex-shrink: 0;"><circle cx="7" cy="14" r="4"/><circle cx="17" cy="14" r="4"/><path d="M11 14h2M3 10l3-3h12l3 3" stroke-linecap="round"/></svg>
        <span style="font-size: 14.5px; color: #C4BAAA; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">مشهد المستشفى</span>
        <span style="font-size: 10px; color: #6F6656; border: 1px solid #302A22; border-radius: 999px; padding: 2px 7px;">مؤقتة</span>
      </div>
    </div>

    <!-- footer nav -->
    <div style="border-top: 1px solid #232019; padding: 10px; display: flex; flex-direction: column; gap: 1px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A69C8D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 4-6 5 5"/><circle cx="3" cy="17" r="0.6" fill="#A69C8D"/></svg>
        <span style="font-size: 14px; color: #E4DCD0;">الرحلة</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A69C8D" stroke-width="1.6" stroke-linecap="round"><path d="M12 4a4 4 0 0 0-4 4 3 3 0 0 0-1 5.8A3.5 3.5 0 0 0 10 20h4a3.5 3.5 0 0 0 3-6.2A3 3 0 0 0 16 8a4 4 0 0 0-4-4zM12 4v16"/></svg>
        <span style="font-size: 14px; color: #E4DCD0;">الذاكرة</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A69C8D" stroke-width="1.6" stroke-linecap="round"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6M10.5 20a2 2 0 0 0 3 0"/></svg>
        <span style="font-size: 14px; color: #E4DCD0; flex-grow: 1;">المهام</span>
        <span style="font-size: 11px; font-weight: 600; color: #1B1510; background: #D9A05B; border-radius: 999px; min-width: 19px; height: 19px; display: flex; align-items: center; justify-content: center; padding: 0 5px;">٣</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A69C8D" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V1a2 2 0 1 1 4 0" transform="scale(0.82) translate(2.6,2.6)"/></svg>
        <span style="font-size: 14px; color: #E4DCD0;">الإعدادات</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6F6656" stroke-width="1.6" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span style="font-size: 14px; color: #8C8273;">خروج</span>
      </div>
    </div>

  </div>

  <!-- scrim over the chat -->
  <div style="flex-grow: 1; height: 100%; background: rgba(8,7,6,0.62);"></div>

</div>
</x-dc>
</body>
</html>
