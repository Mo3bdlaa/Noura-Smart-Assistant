<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #5B6ABF; }
    a:hover { color: #46539B; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 760px; background: #0E1014; font-family: 'Rubik', 'Segoe UI', Tahoma, sans-serif; color: #EDEFF3; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 16px 20px 10px; background: #141821; border-bottom: 1px solid #1E2430;">
    <div style="font-size: 10px; letter-spacing: 0.14em; color: #6B7488;">البديل ب — زجاج بارد</div>
  </div>

  <!-- header card -->
  <div style="margin: 16px; padding: 18px; background: linear-gradient(145deg, #1A2030, #141821); border: 1px solid #232B3A; border-radius: 20px; display: flex; align-items: center; gap: 14px;">
    <div style="width: 46px; height: 46px; border-radius: 16px; background: linear-gradient(145deg, #5B6ABF, #3F4A88); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: #EDEFF3;">ن</div>
    <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1;">
      <div style="font-size: 16px; font-weight: 600;">نورا</div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #4ED2A0;"></span>
        <span style="font-size: 12px; color: #8B94A8;">موجودة معاك</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">

    <div style="align-self: flex-start; max-width: 78%; background: #1A2030; border: 1px solid #232B3A; border-radius: 20px 20px 20px 7px; padding: 13px 16px; font-size: 15px; line-height: 1.6;">صباح النور. نمت كويس؟</div>

    <div style="align-self: flex-end; max-width: 78%; background: linear-gradient(145deg, #5B6ABF, #4A57A5); border-radius: 20px 20px 7px 20px; padding: 13px 16px; font-size: 15px; line-height: 1.6;">أيوة الحمد لله، بس صحيت متأخر</div>

    <div style="align-self: flex-start; width: 236px; background: #1A2030; border: 1px solid #232B3A; border-radius: 20px 20px 20px 7px; padding: 14px; display: flex; align-items: center; gap: 12px;">
      <button style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: #5B6ABF; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#EDEFF3"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
        <div style="height: 4px; border-radius: 2px; background: #2A3244; overflow: hidden;"><div style="width: 38%; height: 100%; background: #5B6ABF; border-radius: 2px;"></div></div>
        <div style="font-size: 11px; color: #6B7488;">0:04 / 0:11</div>
      </div>
    </div>

    <div style="align-self: flex-start; max-width: 84%; background: #1A2030; border: 1px solid #232B3A; border-radius: 20px 20px 20px 7px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 15px; line-height: 1.6;">فاكر الدوا بتاع الصبح؟</div>
      <button style="align-self: flex-start; display: flex; align-items: center; gap: 8px; background: rgba(91,106,191,0.16); border: none; border-radius: 999px; padding: 8px 14px; font-family: inherit; font-size: 12.5px; color: #A3ADD6; cursor: pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/></svg>
        خلّصتها
      </button>
    </div>

  </div>

  <div style="padding: 14px 16px 26px; display: flex; align-items: center; gap: 10px;">
    <div style="flex-grow: 1; display: flex; align-items: center; height: 48px; background: #1A2030; border: 1px solid #232B3A; border-radius: 24px; padding: 0 18px; font-size: 15px; color: #6B7488;">اكتب لـ نورا…</div>
    <button style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(145deg, #5B6ABF, #4A57A5); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#EDEFF3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1);"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
