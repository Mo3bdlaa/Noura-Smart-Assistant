<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F1D1A; }
    a:hover { color: #000000; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 760px; background: #F6F4EF; font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; color: #1F1D1A; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 16px 20px 10px; background: #EFECE4; border-bottom: 1px solid #1F1D1A;">
    <div style="font-size: 10px; letter-spacing: 0.14em; color: #6C675E;">البديل أ — ورق</div>
  </div>

  <!-- header: no avatar, name as a masthead -->
  <div style="padding: 26px 20px 18px; border-bottom: 1px solid #1F1D1A; display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1;">نورا</div>
    <div style="font-size: 11px; color: #6C675E;">موجودة</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 0; overflow: hidden;">

    <!-- messages as typographic blocks, no bubbles -->
    <div style="padding: 18px 20px; border-bottom: 1px solid #DCD8CE; display: flex; flex-direction: column; gap: 5px;">
      <div style="font-size: 10px; letter-spacing: 0.1em; color: #918B80;">هي</div>
      <div style="font-size: 16px; line-height: 1.7; font-weight: 300;">صباح النور. نمت كويس؟</div>
    </div>

    <div style="padding: 18px 20px; border-bottom: 1px solid #DCD8CE; display: flex; flex-direction: column; gap: 5px; background: #EFECE4;">
      <div style="font-size: 10px; letter-spacing: 0.1em; color: #918B80;">إنت</div>
      <div style="font-size: 16px; line-height: 1.7; font-weight: 300;">أيوة الحمد لله، بس صحيت متأخر</div>
    </div>

    <div style="padding: 18px 20px; border-bottom: 1px solid #DCD8CE; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 10px; letter-spacing: 0.1em; color: #918B80;">هي · صوت</div>
      <div style="display: flex; align-items: center; gap: 13px;">
        <button style="width: 36px; height: 36px; border-radius: 0; background: #1F1D1A; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#F6F4EF"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div style="flex-grow: 1; display: flex; align-items: center; gap: 2px; height: 22px;">
          <span style="flex-grow:1; height: 6px; background: #1F1D1A;"></span>
          <span style="flex-grow:1; height: 14px; background: #1F1D1A;"></span>
          <span style="flex-grow:1; height: 20px; background: #1F1D1A;"></span>
          <span style="flex-grow:1; height: 11px; background: #1F1D1A;"></span>
          <span style="flex-grow:1; height: 17px; background: #C9C4B8;"></span>
          <span style="flex-grow:1; height: 8px; background: #C9C4B8;"></span>
          <span style="flex-grow:1; height: 13px; background: #C9C4B8;"></span>
          <span style="flex-grow:1; height: 5px; background: #C9C4B8;"></span>
        </div>
        <span style="font-size: 11px; color: #6C675E; font-variant-numeric: tabular-nums;">0:11</span>
      </div>
    </div>

    <div style="padding: 18px 20px; border-bottom: 1px solid #DCD8CE; display: flex; flex-direction: column; gap: 11px;">
      <div style="font-size: 10px; letter-spacing: 0.1em; color: #918B80;">هي · تذكير</div>
      <div style="font-size: 16px; line-height: 1.7; font-weight: 300;">فاكر الدوا بتاع الصبح؟</div>
      <button style="align-self: flex-start; display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid #1F1D1A; border-radius: 0; padding: 7px 14px; font-family: inherit; font-size: 12px; color: #1F1D1A; cursor: pointer;">
        <span style="width: 11px; height: 11px; border: 1px solid #1F1D1A;"></span>
        خلّصتها
      </button>
    </div>

  </div>

  <!-- composer: a rule, not a pill -->
  <div style="border-top: 1px solid #1F1D1A; background: #EFECE4; padding: 14px 20px 26px; display: flex; align-items: center; gap: 14px;">
    <span style="flex-grow: 1; font-size: 15px; color: #918B80; font-weight: 300;">اكتب…</span>
    <button style="background: transparent; border: none; padding: 0; cursor: pointer; color: #1F1D1A;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button style="height: 38px; padding: 0 18px; background: #1F1D1A; border: none; border-radius: 0; font-family: inherit; font-size: 13px; color: #F6F4EF; cursor: pointer;">إرسال</button>
  </div>

</div>
</x-dc>
</body>
</html>
