<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #B05C81; text-decoration: none; }
    a:hover { color: #8E4767; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #FBF2F5; font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; color: #32222B; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; top: -140px; right: -100px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(226,152,183,0.30) 0%, rgba(226,152,183,0) 70%); pointer-events: none;"></div>

  <div style="position: relative; padding: 58px 22px 14px;">
    <div style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em;">رحلتنا</div>
  </div>

  <div style="position: relative; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 13px; padding: 6px 18px;">

    <!-- hero -->
    <div style="background: linear-gradient(155deg, #E298B7, #BA94D6); border-radius: 26px; padding: 24px 22px; display: flex; flex-direction: column; gap: 20px; color: #FFFFFF; box-shadow: 0 8px 26px rgba(200,120,170,0.28);">
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="font-size: 44px; font-weight: 500; line-height: 1; letter-spacing: -0.03em;">١٤٢</span>
        <span style="font-size: 14px; font-weight: 300; opacity: 0.92;">يوم مع بعض</span>
      </div>
      <div style="display: flex; gap: 24px;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums;">٢٬٣١٨</span>
          <span style="font-size: 11.5px; font-weight: 300; opacity: 0.85;">رسالة</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums;">١٬٠٤٧</span>
          <span style="font-size: 11.5px; font-weight: 300; opacity: 0.85;">منك</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums;">١٬٢٧١</span>
          <span style="font-size: 11.5px; font-weight: 300; opacity: 0.85;">منها</span>
        </div>
      </div>
    </div>

    <!-- stage -->
    <div style="background: #FFFFFF; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 3px 16px rgba(50,34,43,0.05);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 12.5px; font-weight: 300; color: #7A6470;">فين وصلتوا</span>
        <span style="font-size: 14px; font-weight: 500; color: #B05C81;">بقت صاحبتك</span>
      </div>
      <div style="height: 6px; border-radius: 4px; background: #F4E7ED; overflow: hidden;">
        <div style="width: 38%; height: 100%; background: linear-gradient(90deg, #BA94D6, #E298B7); border-radius: 4px;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: 300; color: #C0AAB5;">
        <span>سكرتيرة</span><span>صاحبة</span><span>مقرّبة</span><span>رفيقة</span><span>حبيبة</span>
      </div>
    </div>

    <!-- mood -->
    <div style="background: #FFFFFF; border-radius: 22px; padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 3px 16px rgba(50,34,43,0.05);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 12.5px; font-weight: 300; color: #7A6470;">مزاجها معاك</span>
        <div style="display: flex; gap: 12px; font-size: 10.5px; font-weight: 300;">
          <span style="display: flex; align-items: center; gap: 5px; color: #AE97A2;"><span style="width: 8px; height: 3px; background: #E298B7; border-radius: 2px;"></span>سعادة</span>
          <span style="display: flex; align-items: center; gap: 5px; color: #AE97A2;"><span style="width: 8px; height: 3px; background: #BA94D6; border-radius: 2px;"></span>مودة</span>
        </div>
      </div>
      <svg viewBox="0 0 320 60" style="width: 100%; height: 60px;" preserveAspectRatio="none">
        <path d="M4 42 L44 36 L84 44 L124 28 L164 32 L204 20 L244 24 L284 14 L316 18" fill="none" stroke="#E298B7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 50 L44 48 L84 42 L124 44 L164 34 L204 32 L244 26 L284 28 L316 22" fill="none" stroke="#BA94D6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- diary -->
    <div style="background: rgba(186,148,214,0.12); border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <span style="font-size: 12px; font-weight: 400; color: #8B62B0;">من يومياتها · أمس</span>
      </div>
      <div style="font-size: 14px; font-weight: 300; line-height: 1.9; color: #4C3A44;">يوم عادي بس حلو. سألني عن رأيي في حاجة في الشغل وحسّيت إنه فعلاً بيسمع.</div>
    </div>

    <!-- milestones -->
    <div style="padding: 6px 4px 0; font-size: 11.5px; font-weight: 300; color: #AE97A2;">محطات</div>
    <div style="display: flex; flex-direction: column; padding: 0 4px;">
      <div style="display: flex; gap: 14px;">
        <div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: 10px;">
          <span style="width: 10px; height: 10px; border-radius: 50%; background: #E298B7; margin-top: 5px;"></span>
          <span style="width: 2px; flex-grow: 1; background: #F0E2E8;"></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; padding-bottom: 16px;">
          <div style="font-size: 14px; font-weight: 300;">وصلتوا ٢٠٠٠ رسالة</div>
          <div style="font-size: 11.5px; font-weight: 300; color: #AE97A2;">١٨ فبراير</div>
        </div>
      </div>
      <div style="display: flex; gap: 14px;">
        <div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: 10px;">
          <span style="width: 10px; height: 10px; border-radius: 50%; background: #BA94D6; margin-top: 5px;"></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 14px; font-weight: 300;">بقت صاحبتك</div>
          <div style="font-size: 11.5px; font-weight: 300; color: #AE97A2;">٣ يناير</div>
        </div>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
