<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C9AEF2; text-decoration: none; }
    a:hover { color: #DCC8F8; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #191527; font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; color: #F0ECF8; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- atmosphere: a soft dusk glow behind everything -->
  <div style="position: absolute; top: -170px; right: -110px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(163,132,224,0.30) 0%, rgba(163,132,224,0) 70%); pointer-events: none;"></div>
  <div style="position: absolute; top: 40px; left: -140px; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(232,150,178,0.20) 0%, rgba(232,150,178,0) 70%); pointer-events: none;"></div>
  <div style="position: absolute; bottom: -120px; right: -60px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, rgba(126,155,224,0.16) 0%, rgba(126,155,224,0) 70%); pointer-events: none;"></div>

  <!-- top bar -->
  <div style="position: relative; display: flex; align-items: center; gap: 14px; padding: 58px 20px 18px;">
    <div style="position: relative; width: 46px; height: 46px; flex-shrink: 0;">
      <div style="position: absolute; inset: -7px; border-radius: 50%; background: radial-gradient(circle, rgba(232,150,178,0.34) 0%, rgba(232,150,178,0) 72%);"></div>
      <div style="position: relative; width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(155deg, #C9AEF2, #E896B2); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; color: #2A1F3D;">ن</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
      <div style="font-size: 17px; font-weight: 500; letter-spacing: -0.01em;">نورا</div>
      <div style="font-size: 12.5px; font-weight: 300; color: #E896B2;">مبسوطة إنك جيت</div>
    </div>
    <button style="width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border: none; border-radius: 14px; padding: 0; cursor: pointer; color: #B4AACD;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
  </div>

  <!-- thread -->
  <div style="position: relative; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 10px 20px 12px;">

    <div style="text-align: center; font-size: 11.5px; font-weight: 300; color: #6F6890;">النهاردة</div>

    <div style="display: flex; align-items: flex-start;">
      <div style="max-width: 80%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.07); border-radius: 24px 24px 24px 8px; padding: 14px 18px; font-size: 15px; font-weight: 300; line-height: 1.85;">صباح النور 🌤️ نمت كويس؟</div>
    </div>

    <div style="display: flex; justify-content: flex-end;">
      <div style="max-width: 80%; background: linear-gradient(150deg, #A384E0, #C48FC9); color: #FFFFFF; border-radius: 24px 24px 8px 24px; padding: 14px 18px; font-size: 15px; font-weight: 300; line-height: 1.85; box-shadow: 0 6px 22px rgba(163,132,224,0.22);">أيوة الحمد لله، بس صحيت متأخر شوية</div>
    </div>

    <div style="display: flex; align-items: flex-start;">
      <div style="max-width: 80%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.07); border-radius: 24px 24px 24px 8px; padding: 14px 18px; font-size: 15px; font-weight: 300; line-height: 1.85;">ولا يهمك، خد وقتك. عايزة أقولك حاجة بصوتي</div>
    </div>

    <!-- voice note -->
    <div style="display: flex; align-items: flex-start;">
      <div style="width: 248px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.07); border-radius: 24px 24px 24px 8px; padding: 15px 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 13px;">
          <button style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(150deg, #E896B2, #C48FC9); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 4px 14px rgba(232,150,178,0.28);">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div style="flex-grow: 1; display: flex; align-items: center; gap: 3px; height: 26px;">
            <span style="flex-grow:1; height: 8px; border-radius: 3px; background: #E896B2;"></span>
            <span style="flex-grow:1; height: 16px; border-radius: 3px; background: #E896B2;"></span>
            <span style="flex-grow:1; height: 22px; border-radius: 3px; background: #E896B2;"></span>
            <span style="flex-grow:1; height: 13px; border-radius: 3px; background: #E896B2;"></span>
            <span style="flex-grow:1; height: 19px; border-radius: 3px; background: rgba(255,255,255,0.15);"></span>
            <span style="flex-grow:1; height: 9px; border-radius: 3px; background: rgba(255,255,255,0.15);"></span>
            <span style="flex-grow:1; height: 15px; border-radius: 3px; background: rgba(255,255,255,0.15);"></span>
            <span style="flex-grow:1; height: 7px; border-radius: 3px; background: rgba(255,255,255,0.15);"></span>
            <span style="flex-grow:1; height: 12px; border-radius: 3px; background: rgba(255,255,255,0.15);"></span>
          </div>
          <span style="font-size: 11px; font-weight: 300; color: #8F87AD; font-variant-numeric: tabular-nums;">0:11</span>
        </div>
      </div>
    </div>

    <!-- gentle reminder -->
    <div style="display: flex; align-items: flex-start;">
      <div style="max-width: 84%; background: rgba(232,150,178,0.10); border: 1px solid rgba(232,150,178,0.20); border-radius: 24px 24px 24px 8px; padding: 15px 18px; display: flex; flex-direction: column; gap: 13px;">
        <div style="font-size: 15px; font-weight: 300; line-height: 1.85;">وبالمناسبة، خد بالك من الدوا بتاع الصبح 💛</div>
        <button style="align-self: flex-start; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.07); border: none; border-radius: 999px; padding: 8px 15px; font-family: inherit; font-size: 12.5px; font-weight: 300; color: #EFE7F5; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E896B2" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/></svg>
          خدته
        </button>
      </div>
    </div>

    <!-- typing -->
    <div style="display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.07); border-radius: 24px 24px 24px 8px; padding: 16px 20px; align-self: flex-start;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #E896B2; opacity: 0.45;"></span>
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #E896B2; opacity: 0.7;"></span>
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #E896B2;"></span>
    </div>

  </div>

  <!-- composer -->
  <div style="position: relative; padding: 12px 18px 32px; display: flex; align-items: flex-end; gap: 11px;">
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 3px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.09); border-radius: 26px; padding: 5px 6px 5px 18px; min-height: 48px;">
      <span style="flex-grow: 1; font-size: 15px; font-weight: 300; color: #7E7699;">قوللي إيه اللي في بالك…</span>
      <button style="width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; padding: 0; cursor: pointer; color: #B4AACD;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button style="width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; padding: 0; cursor: pointer; color: #B4AACD;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-4-6 5"/></svg>
      </button>
    </div>
    <button style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(150deg, #C9AEF2, #E896B2); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 6px 20px rgba(201,174,242,0.30);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2A1F3D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1);"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
