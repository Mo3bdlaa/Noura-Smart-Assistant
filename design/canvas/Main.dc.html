<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #D9A05B; text-decoration: none; }
    a:hover { color: #E8B87A; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #141210; font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; color: #F4EFE7; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- top bar -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 56px 18px 14px; border-bottom: 1px solid #262119; background: #171410;">
    <div style="position: relative; width: 42px; height: 42px; flex-shrink: 0;">
      <div style="width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(150deg, #3A322A, #241F18); border: 1px solid #38312A; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #C9A87C;">ن</div>
      <div style="position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid #7FB396; opacity: 0.55;"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
      <div style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">نورا</div>
      <div style="font-size: 12.5px; color: #7FB396;">موجودة معاك</div>
    </div>
    <button style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; padding: 0; cursor: pointer; color: #A69C8D;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>

  <!-- thread -->
  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 22px 18px 12px;">

    <div style="text-align: center; font-size: 11.5px; color: #6F6656; letter-spacing: 0.02em;">النهاردة</div>

    <!-- assistant -->
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px;">
      <div style="max-width: 78%; background: #221E19; border: 1px solid #2E2921; border-radius: 18px 18px 18px 5px; padding: 11px 15px; font-size: 15px; line-height: 1.65;">صباح النور. نمت كويس؟</div>
    </div>

    <!-- user -->
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
      <div style="max-width: 78%; background: #D9A05B; color: #1B1510; border-radius: 18px 18px 5px 18px; padding: 11px 15px; font-size: 15px; line-height: 1.65; font-weight: 500;">أيوة الحمد لله، بس صحيت متأخر</div>
    </div>

    <!-- assistant voice note -->
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px;">
      <div style="width: 232px; background: #221E19; border: 1px solid #2E2921; border-radius: 18px 18px 18px 5px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; align-items: center; gap: 11px;">
          <button style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: #D9A05B; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="#1B1510"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
            <div style="height: 3px; border-radius: 2px; background: #332C24; overflow: hidden;">
              <div style="width: 38%; height: 100%; background: #D9A05B; border-radius: 2px;"></div>
            </div>
            <div style="font-size: 11px; color: #6F6656; font-variant-numeric: tabular-nums;">0:04 / 0:11</div>
          </div>
        </div>
        <button style="align-self: flex-start; background: transparent; border: none; padding: 0; font-family: inherit; font-size: 11.5px; color: #A69C8D; cursor: pointer;">النص</button>
      </div>
    </div>

    <!-- reminder with mark-done -->
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px;">
      <div style="max-width: 82%; background: #221E19; border: 1px solid #2E2921; border-radius: 18px 18px 18px 5px; padding: 11px 15px; display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 15px; line-height: 1.65;">فاكر الدوا بتاع الصبح؟</div>
        <button style="align-self: flex-start; display: flex; align-items: center; gap: 7px; background: transparent; border: 1px solid #3A332A; border-radius: 999px; padding: 6px 12px; font-family: inherit; font-size: 12.5px; color: #A69C8D; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/></svg>
          خلّصتها
        </button>
      </div>
    </div>

    <!-- user -->
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
      <div style="max-width: 78%; background: #D9A05B; color: #1B1510; border-radius: 18px 18px 5px 18px; padding: 11px 15px; font-size: 15px; line-height: 1.65; font-weight: 500;">اه اخدته أول ما صحيت</div>
    </div>

    <!-- typing -->
    <div style="display: flex; align-items: center; gap: 5px; background: #221E19; border: 1px solid #2E2921; border-radius: 18px 18px 18px 5px; padding: 14px 16px; align-self: flex-start;">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #6F6656;"></span>
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #8C8273;"></span>
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #A69C8D;"></span>
    </div>

  </div>

  <!-- composer -->
  <div style="border-top: 1px solid #262119; background: #171410; padding: 12px 14px 30px; display: flex; align-items: flex-end; gap: 10px;">
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 4px; background: #221E19; border: 1px solid #302A22; border-radius: 22px; padding: 5px 6px 5px 14px; min-height: 44px;">
      <input placeholder="اكتب لـ نورا…" style="flex-grow: 1; background: transparent; border: none; outline: none; font-family: inherit; font-size: 15px; color: #F4EFE7; min-width: 0;">
      <button style="width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; padding: 0; cursor: pointer; color: #A69C8D;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button style="width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: none; padding: 0; cursor: pointer; color: #A69C8D;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-4-6 5"/></svg>
      </button>
    </div>
    <button style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #D9A05B; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1B1510" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1);"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
