<!doctype html>
<html>

<x-dc>

    body { margin: 0; }
    a { color: #D9A05B; text-decoration: none; }

  </style>

<div dir="rtl" style="width: 390px; height: 844px; background: #141210; font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; color: #F4EFE7; display: flex; flex-direction: column; overflow: hidden;">

  <!-- header -->

    </button>

        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 11.5px; color: #6F6656;">٩:٠٠ ص</span>

          <span style="width: 7px; height: 7px; border-radius: 2px; background: #7FB396;"></span>

    </div>

    <!-- open task -->
    <div style="display: flex; align-items: flex-start; gap: 13px; padding: 13px 20px; border-bottom: 1px solid #201C17;">
      <button style="width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px; border-radius: 50%; background: transparent; border: 1.6px solid #3A332A; cursor: pointer; padding: 0;"></button>

    </div>

    <!-- upcoming -->

    <div style="display: flex; align-items: center; gap: 13px; padding: 13px 20px; border-bottom: 1px solid #201C17;">

        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>

    <div style="display: flex; align-items: flex-start; gap: 13px; padding: 11px 20px;">
