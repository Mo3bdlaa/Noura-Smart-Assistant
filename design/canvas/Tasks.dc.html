<!doctype html>
<html>

<body>
<x-dc>

  <style>

<div dir="rtl" style="width: 390px; height: 844px; background: #FBF2F5; font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; color: #32222B; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; top: -170px; left: -110px; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(186,148,214,0.24) 0%, rgba(186,148,214,0) 70%); pointer-events: none;"></div>

  <div style="position: relative; padding: 58px 22px 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">

      <div style="font-size: 24px; font-weight: 500; letter-spacing: -0.02em;">مهامك</div>

    </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0;">

        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 11.5px; font-weight: 300; color: #AE97A2;">٩:٠٠ ص</span>

          <span style="width: 8px; height: 8px; border-radius: 3px; background: #D97DA5;"></span>

    <!-- open with time -->

      <button style="width: 24px; height: 24px; flex-shrink: 0; margin-top: 1px; border-radius: 50%; background: transparent; border: 1.8px solid #E3CFD9; cursor: pointer; padding: 0;"></button>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0;">
        <div style="font-size: 15px; font-weight: 300;">أكلّم أحمد بخصوص العقد</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 11.5px; font-weight: 300; color: #AE97A2;">٤:٣٠ م</span>
          <span style="font-size: 10.5px; font-weight: 300; color: #B05C81; background: rgba(217,125,165,0.14); border-radius: 999px; padding: 3px 9px;">بعد ساعتين</span>
        </div>
      </div>
    </div>

    <!-- simple todo -->
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 3px 16px rgba(50,34,43,0.05);">
      <button style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; background: transparent; border: 1.8px solid #E3CFD9; cursor: pointer; padding: 0;"></button>

    <div style="background: rgba(186,148,214,0.13); border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px;">
      <span style="width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #8B62B0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>

        <div style="font-size: 11.5px; font-weight: 300; color: #8A7581;">١٤ مارس · كل سنة</div>
      </div>
      <span style="font-size: 11.5px; font-weight: 300; color: #8B62B0;">بعد ٢١ يوم</span>

    <!-- notes -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 4px 0;">
      <span style="font-size: 11.5px; font-weight: 300; color: #AE97A2;">نوتس</span>

      <div style="display: flex; align-items: flex-start; gap: 11px;">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #E298B7; flex-shrink: 0; margin-top: 8px;"></span>
        <div style="font-size: 14px; font-weight: 300; color: #55414C; line-height: 1.8;">باسورد الواي فاي: 40028922</div>

      <div style="display: flex; align-items: flex-start; gap: 11px;">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #E298B7; flex-shrink: 0; margin-top: 8px;"></span>
        <div style="font-size: 14px; font-weight: 300; color: #55414C; line-height: 1.8;">مقاس القميص عند الترزي — ٤٢</div>
      </div>
    </div>

  </div>

</div>
